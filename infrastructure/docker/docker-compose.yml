version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: agrivision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrivision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrivision_password}
      POSTGRES_DB: ${POSTGRES_DB:-agrivision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrivision_user} -d ${POSTGRES_DB:-agrivision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrivision-network

  redis:
    image: redis:7-alpine
    container_name: agrivision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrivision-network

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: agrivision-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - agrivision-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.7.1
    container_name: agrivision-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://agrivision-artifacts/
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "5000:5000"
    depends_on:
      - minio
    volumes:
      - mlflow_data:/app
    networks:
      - agrivision-network

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: agrivision-backend
    restart: unless-stopped
    environment:
      AGRIVISION_ENV: ${AGRIVISION_ENV:-development}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrivision_user}:${POSTGRES_PASSWORD:-agrivision_password}@postgres:5432/${POSTGRES_DB:-agrivision}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-agrivision-storage}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_for_dev_mode_only_12345}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.weatherapi.com/v1}
      AI_SERVICE_URL: http://ai-service:8001
      MAX_UPLOAD_SIZE_MB: 15
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agrivision-network

  ai-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: agrivision-ai-service
    restart: unless-stopped
    environment:
      DEVICE: ${DEVICE:-cpu}
      TROCR_MODEL_NAME: ${TROCR_MODEL_NAME:-microsoft/trocr-base-handwritten}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-agrivision-storage}
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - minio
    networks:
      - agrivision-network

networks:
  agrivision-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mlflow_data:
