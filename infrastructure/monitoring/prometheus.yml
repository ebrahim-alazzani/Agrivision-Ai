global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "agrivision-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - target_label: application
        replacement: agrivision-api

  - job_name: "agrivision-ai-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["ai-service:8001"]
    relabel_configs:
      - target_label: application
        replacement: agrivision-inference-worker

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis:9121"]
