# ==============================================================================
# AgriVision AI - Baseline Model Training Configuration
# Architecture: ResNet50 Transfer Learning for Plant Disease Classification
# ==============================================================================

experiment_name: "agrivision-baseline-resnet50"
run_name: "resnet50-plant-pathology-v1"

# Model Architecture
model: "resnet50"
pretrained: true
num_classes: 10          # Configurable according to target crop/disease set
dropout_rate: 0.3

# Hardware & Compute Environment
device: "auto"           # auto (selects cuda -> mps -> cpu), or explicitly: "cuda", "cpu"
num_workers: 4
pin_memory: true

# Hyperparameters
epochs: 50
batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
gradient_clip_val: 1.0

# Optimizer & Learning Rate Schedule
optimizer: "Adam"
optimizer_params:
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler: "CosineAnnealingLR"
scheduler_params:
  T_max: 50
  eta_min: 0.00001

# Loss Function
loss_function: "CrossEntropyLoss"
label_smoothing: 0.1

# Data Preprocessing & Augmentation
image_size: 224
channels: 3
augmentation: "standard"
augmentation_params:
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.2
  random_rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Early Stopping & Checkpointing
early_stopping:
  enabled: true
  monitor: "val_loss"
  patience: 8
  mode: "min"

checkpoint:
  monitor: "val_acc"
  mode: "max"
  save_top_k: 3
  save_last: true

# Tracking & Telemetry
mlflow:
  enabled: true
  tracking_uri: "http://localhost:5000"
  experiment_name: "plant-vision-benchmarks"
